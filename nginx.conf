# Replaces /etc/nginx/conf.d/default.conf in the nginx image (included inside its http block).

# Fonts never change under the same name, so they're cached for a year. Everything else (HTML,
# and the CSS and JS, which aren't fingerprinted) is revalidated on every load. nginx answers with
# a cheap 304 when nothing changed, and a deploy can never pair new HTML with yesterday's JS modules.
map $uri $cache_control {
  ~^/fonts/       "public, max-age=31536000, immutable";
  default         "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off; # kamal-proxy terminates TLS; nginx only sees http

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  # kamal-proxy's health check
  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
  }

  # /journal → journal.html or journal/index.html, when those exist
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
